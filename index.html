<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 禁止 iOS Safari 雙擊放大，確保點擊反應即時 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>河粉小店記帳</title>

    <!-- iOS PWA 專屬設定：支援全螢幕、自訂主畫面標題 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="河粉記帳">
    <meta name="format-detection" content="telephone=no">

    <style>
        :root {
            --primary: #d35400;
            --primary-active: #a04000;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border: #e2e8f0;
            --danger: #e74c3c;
            --success: #27ae60;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 20px) 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin: 16px 0;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .total-card {
            background: linear-gradient(135deg, #e67e22, var(--primary));
            color: #ffffff;
            text-align: center;
            padding: 22px 16px;
            border-radius: 14px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(211, 84, 0, 0.2);
        }

        .total-card .label {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .total-card .amount {
            font-size: 2.2rem;
            font-weight: 800;
            margin-top: 4px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: #fafafa;
            -webkit-appearance: none;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .cat-btn {
            background: #edf2f7;
            border: 1px solid var(--border);
            padding: 10px 4px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            text-align: center;
        }

        .cat-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .btn-main {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-main:active {
            background: var(--primary-active);
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .list-header h3 {
            font-size: 1rem;
        }

        .item-list {
            list-style: none;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .item-subtitle {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .item-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-cost {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--success);
        }

        .btn-del {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 1.1rem;
            padding: 4px 6px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .btn-sub {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            background: #ffffff;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .empty-text {
            text-align: center;
            color: var(--text-sub);
            padding: 20px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍲 河粉小店進貨記帳</h1>
        <p id="current-date"></p>
    </header>

    <div class="total-card">
        <div class="label">今日進貨總支出</div>
        <div class="amount" id="total-amount">NT$ 0</div>
    </div>

    <div class="card">
        <div class="form-group">
            <label>選擇進貨類別</label>
            <div class="category-grid" id="category-container">
                <button type="button" class="cat-btn active" data-cat="牛肉/肉品">牛肉/肉品</button>
                <button type="button" class="cat-btn" data-cat="河粉/麵條">河粉/麵條</button>
                <button type="button" class="cat-btn" data-cat="蔬菜/香草">蔬菜/香草</button>
                <button type="button" class="cat-btn" data-cat="醬料/調味">醬料/調味</button>
                <button type="button" class="cat-btn" data-cat="包材/餐具">包材/餐具</button>
                <button type="button" class="cat-btn" data-cat="其他雜支">其他雜支</button>
            </div>
        </div>

        <div class="form-group">
            <label for="item-name">品項 / 廠商備註（選填）</label>
            <input type="text" id="item-name" placeholder="例如：牛大骨、檸檬、九層塔">
        </div>

        <div class="form-group">
            <label for="item-amount">發票 / 單據金額 (NT$)</label>
            <input type="number" id="item-amount" inputmode="numeric" placeholder="請輸入金額">
        </div>

        <button type="button" class="btn-main" id="add-btn">＋ 加入今日清單</button>
    </div>

    <div class="card">
        <div class="list-header">
            <h3>今日進貨明細 (<span id="item-count">0</span> 筆)</h3>
        </div>

        <ul class="item-list" id="invoice-list"></ul>

        <div class="btn-group">
            <button type="button" class="btn-sub" id="copy-btn">📋 複製結算文字</button>
            <button type="button" class="btn-sub" id="clear-btn" style="color: var(--danger);">🗑️ 清空重記</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'PHO_SHOP_DATA_' + new Date().toISOString().split('T')[0];
        let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentCategory = '牛肉/肉品';

        const totalAmountEl = document.getElementById('total-amount');
        const itemCountEl = document.getElementById('item-count');
        const invoiceListEl = document.getElementById('invoice-list');
        const itemNameEl = document.getElementById('item-name');
        const itemAmountEl = document.getElementById('item-amount');
        const addBtn = document.getElementById('add-btn');
        const copyBtn = document.getElementById('copy-btn');
        const clearBtn = document.getElementById('clear-btn');
        const currentDateEl = document.getElementById('current-date');
        const catButtons = document.querySelectorAll('.cat-btn');

        const today = new Date();
        currentDateEl.innerText = today.toLocaleDateString('zh-TW', {
            year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
        });

        catButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                catButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.cat;
            });
        });

        function render() {
            invoiceListEl.innerHTML = '';
            let total = 0;

            if (items.length === 0) {
                invoiceListEl.innerHTML = '<li class="empty-text">今天還沒有進貨紀錄，請輸入金額開始記帳！</li>';
            } else {
                items.forEach((item, index) => {
                    total += Number(item.amount);
                    const li = document.createElement('li');
                    li.className = 'item-row';
                    li.innerHTML = `
                        <div>
                            <div class="item-title">${item.name || item.category}</div>
                            <div class="item-subtitle">${item.category} · ${item.time}</div>
                        </div>
                        <div class="item-right">
                            <div class="item-cost">NT$ ${Number(item.amount).toLocaleString()}</div>
                            <button class="btn-del" onclick="deleteItem(${index})">✕</button>
                        </div>
                    `;
                    invoiceListEl.appendChild(li);
                });
            }

            totalAmountEl.innerText = `NT$ ${total.toLocaleString()}`;
            itemCountEl.innerText = items.length;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        }

        function addItem() {
            const amount = parseFloat(itemAmountEl.value);
            if (!amount || amount <= 0) {
                alert('請輸入正確的金額！');
                itemAmountEl.focus();
                return;
            }

            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            items.unshift({
                name: itemNameEl.value.trim(),
                category: currentCategory,
                amount: amount,
                time: timeStr
            });

            render();
            itemNameEl.value = '';
            itemAmountEl.value = '';
            itemAmountEl.focus();
        }

        window.deleteItem = function(index) {
            if (confirm('確定要刪除這筆紀錄嗎？')) {
                items.splice(index, 1);
                render();
            }
        };

        function copySummary() {
            if (items.length === 0) {
                alert('目前沒有資料可複製！');
                return;
            }

            let total = 0;
            let text = `【河粉小店 每日進貨結算】\n日期：${currentDateEl.innerText}\n--------------------\n`;
            items.forEach((item, i) => {
                total += item.amount;
                text += `${i + 1}. [${item.category}] ${item.name || '進貨'} - NT$ ${item.amount.toLocaleString()}\n`;
            });
            text += `--------------------\n共 ${items.length} 筆，總計支出：NT$ ${total.toLocaleString()}`;

            navigator.clipboard.writeText(text).then(() => {
                alert('已複製今日結算報表！可以直接貼到 LINE。');
            }).catch(() => {
                alert('複製失敗，請手動複製。');
            });
        }

        function clearAll() {
            if (items.length === 0) return;
            if (confirm('確定要清空今天所有的進貨紀錄嗎？')) {
                items = [];
                render();
            }
        }

        addBtn.addEventListener('click', addItem);
        copyBtn.addEventListener('click', copySummary);
        clearBtn.addEventListener('click', clearAll);

        itemAmountEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addItem();
        });

        render();
    </script>
</body>
</html>
